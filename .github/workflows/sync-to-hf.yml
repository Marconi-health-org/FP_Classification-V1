name: Sync to Hugging Face Hub

on:
  push:
    branches: [ main, colab ]  # Triggers on both main and colab branches
  workflow_dispatch:            # Allows manual trigger from GitHub Actions tab

jobs:
  sync-to-hf:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout GitHub Repository
        uses: actions/checkout@v4

      - name: Configure Git & Clone HF Model Repo
        env:
          HF_TOKEN: ${{ secrets.HF_MARC }}
        run: |
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"

          # Notice the exact spelling: FP_Classifcation-V1
          git clone https://Marc-HealthAI:$HF_TOKEN@huggingface.co/Marc-HealthAI/FP_Classifcation-V1 hf_repo

      - name: Copy Architecture Code & Config
        run: |
          # Copy scripts if they exist in scripts/ or in root
          if [ -d "scripts" ]; then
            cp -v scripts/configuration_fetal_plane.py hf_repo/ 2>/dev/null || true
            cp -v scripts/modeling_fetal_plane.py hf_repo/ 2>/dev/null || true
          else
            cp -v configuration_fetal_plane.py hf_repo/ 2>/dev/null || true
            cp -v modeling_fetal_plane.py hf_repo/ 2>/dev/null || true
          fi

      - name: Push to Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HF_MARC }}
        run: |
          cd hf_repo
          git add configuration_fetal_plane.py modeling_fetal_plane.py
          
          # Check if there are differences to commit
          if git status --porcelain | grep -E 'configuration_fetal_plane.py|modeling_fetal_plane.py'; then
            git commit -m "Auto-sync custom architecture from GitHub"
            git push https://Marc-HealthAI:$HF_TOKEN@huggingface.co/Marc-HealthAI/FP_Classifcation-V1 main
            echo "Successfully updated Hugging Face repo."
          else
            echo "No changes detected between GitHub and Hugging Face."
          fi