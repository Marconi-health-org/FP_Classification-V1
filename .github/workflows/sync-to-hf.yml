name: Sync Architecture Code to Hugging Face

on:
  push:
    branches: [ main ]
    paths:
      - 'Scripts/configuration_fetal_plane.py'
      - 'Scripts/modeling_fetal_plane.py'

jobs:
  sync-to-hf:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout GitHub Repository
        uses: actions/checkout@v4

      - name: Clone Hugging Face Model Repo
        env:
          HF_TOKEN: ${{ secrets.HF_MARC }}
        run: |
          git config --global user.email "action@github.com"
          git config --global user.name "GitHub Action"
          
          # Clone the HF model repo into a temporary folder
          git clone https://user:$HF_TOKEN@huggingface.co/Marc-HealthAI/FP_Classification-V1 hf_repo

      - name: Copy Custom Architecture Code
        run: |
          # Copy only the custom architecture files to the root of the HF repo
          cp Scripts/configuration_fetal_plane.py hf_repo/
          cp Scripts/modeling_fetal_plane.py hf_repo/
          cp Scripts/sample_model_inference.py hf_repo/

      - name: Commit and Push to Hugging Face
        run: |
          cd hf_repo
          git add configuration_fetal_plane.py modeling_fetal_plane.py sample_model.inference.py
          # Only commit if there are changes
          git diff-index --quiet HEAD || git commit -m "Sync custom architecture code from GitHub"
          git push origin main