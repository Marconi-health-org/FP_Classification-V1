name: Sync Architecture Code to Hugging Face

on:
  push:
    branches: [ main, colab ]
    paths:
      - 'scripts/configuration_fetal_plane.py'
      - 'scripts/modeling_fetal_plane.py'
      - 'scripts/sample_model_inference.py'
  workflow_dispatch:

jobs:
  sync-to-hf:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout GitHub Repository
        uses: actions/checkout@v4

      - name: Clone Hugging Face Model Repo
        env:
          HF_TOKEN: ${{ secrets.HF_MARC }}
        run: |
          git config --global user.email "action@github.com"
          git config --global user.name "GitHub Action"

          # Skip large weights download
          export GIT_LFS_SKIP_SMUDGE=1

          # Note the exact HF repository name: FP_Classifcation-V1
          git clone https://user:$HF_TOKEN@huggingface.co/Marc-HealthAI/FP_Classifcation-V1 hf_repo

      - name: Copy Custom Architecture Code
        run: |
          # Handles both 'scripts' and 'Scripts' capitalization
          if [ -d "scripts" ]; then
            SRC_DIR="scripts"
          elif [ -d "Scripts" ]; then
            SRC_DIR="Scripts"
          else
            SRC_DIR="."
          fi

          echo "Copying files from directory: $SRC_DIR"
          cp -v $SRC_DIR/configuration_fetal_plane.py hf_repo/
          cp -v $SRC_DIR/modeling_fetal_plane.py hf_repo/
          cp -v $SRC_DIR/sample_model_inference.py hf_repo/ 2>/dev/null || true

      - name: Commit and Push to Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HF_MARC }}
        run: |
          cd hf_repo
          git add configuration_fetal_plane.py modeling_fetal_plane.py sample_model_inference.py 2>/dev/null || true

          if ! git diff-index --quiet HEAD; then
            git commit -m "Sync custom architecture code from GitHub [skip ci]"
            git push origin main
            echo "Successfully updated Hugging Face repository!"
          else
            echo "No changes detected. Hugging Face is already up to date."
          fi